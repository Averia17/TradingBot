name: tradingbot-research

x-paper-fill-kafka: &paper-fill-kafka
  TRADINGBOT_KAFKA_BROKERS: kafka:9092
  TRADINGBOT_TRADE_TOPIC: tradingbot.trade.filled.paper.v1

x-trading-api-build: &trading-api-build
  context: ../../services/trading-api
  args:
    GO_IMAGE: ${TRADINGBOT_GO_BUILD_IMAGE:-golang:1.26.5-bookworm@sha256:53eeac89074db483fdf0ab3be1df32bf6e47562263d2d0d6baa7f26acb4957dd}

x-paper-token-mount: &paper-token-mount
  type: volume
  source: internal-token
  target: /run/tradingbot/internal
  read_only: true

x-outbox-token-mount: &outbox-token-mount
  type: volume
  source: outbox-token
  target: /run/tradingbot/outbox
  read_only: true

x-paper-service-endpoints: &paper-service-endpoints
  TRADINGBOT_TRADING_API_URL: http://trading-api:8080
  TRADINGBOT_ACCOUNTS_URL: http://accounts:8081
  TRADINGBOT_PAPER_INTERNAL_TOKEN_FILE: /run/tradingbot/internal/token

services:
  postgres: &local-postgres
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: research_control
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, research_control, -d, tradingbot]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [storage]
    volumes:
      - jobs-data:/var/lib/postgresql/data

  accounts-postgres:
    <<: *local-postgres
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, accounts, -d, accounts]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [accounts-storage]
    volumes:
      - accounts-data:/var/lib/postgresql/data

  trade-events-postgres:
    <<: *local-postgres
    profiles: [paper-notifications]
    environment:
      POSTGRES_DB: trade_events
      POSTGRES_USER: trade_events
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, trade_events, -d, trade_events]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [events-storage]
    volumes:
      - trade-events-data:/var/lib/postgresql/data

  paper-internal-token:
    image: busybox:latest@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    network_mode: none
    read_only: true
    command:
      - sh
      - -ec
      - |
        initialize() {
          if [ ! -s "$$1/token" ]; then
            token=$$(od -An -tx1 -N32 /dev/urandom | tr -d '[:space:]')
            test "$${#token}" -eq 64
            umask 077
            printf '%s' "$$token" > "$$1/token.tmp"
            chmod 0444 "$$1/token.tmp"
            mv "$$1/token.tmp" "$$1/token"
          fi
        }
        initialize /internal
        initialize /outbox
    volumes:
      - internal-token:/internal
      - outbox-token:/outbox

  accounts:
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-trading-api:local}
    build: *trading-api-build
    entrypoint: [/usr/local/bin/accounts]
    command: [--listen, 0.0.0.0:8081]
    environment:
      TRADINGBOT_ACCOUNTS_DATABASE_URL: postgresql://accounts@accounts-postgres:5432/accounts?sslmode=disable
      TRADINGBOT_PAPER_INTERNAL_TOKEN_FILE: /run/tradingbot/internal/token
      TRADINGBOT_ACCOUNTS_OUTBOX_TOKEN_FILE: /run/tradingbot/outbox/token
    depends_on:
      accounts-postgres:
        condition: service_healthy
      paper-internal-token:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/readyz]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - *paper-token-mount
      - *outbox-token-mount
    networks: [accounts-storage, paper-api, accounts-events]
    read_only: true

  trading-api:
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-trading-api:local}
    build: *trading-api-build
    command: [--listen, 0.0.0.0:8080]
    environment:
      <<: *paper-service-endpoints
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
      paper-internal-token:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${TRADINGBOT_CONTROL_PORT:-18080}:8080'
    volumes:
      - *paper-token-mount
    networks: [storage, workers, local-api, paper-api]
    read_only: true

  research:
    image: ${TRADINGBOT_RESEARCH_IMAGE:-tradingbot-research:local}
    build:
      context: ../../services/research
    command: [worker, --control-url, 'http://trading-api:8080']
    depends_on:
      trading-api:
        condition: service_healthy
    networks: [workers]
    read_only: true
    tmpfs:
      - /tmp

  paper-research:
    extends:
      service: research
    profiles: [paper]
    command: [worker, --control-url, 'http://trading-api:8080', --archive-root, /archive]
    volumes:
      - type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  identity-research:
    extends:
      service: research
    profiles: [research-identity]
    command:
      - worker
      - --control-url
      - http://trading-api:8080
      - --archive-root
      - /archive
      - --identity-registry-ref
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_REF:-}'
      - --identity-registry-sha256
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}'
    volumes:
      - type: bind
        source: ${TRADINGBOT_RESEARCH_IDENTITY_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  provider-research:
    extends:
      service: research
    profiles: [research-provider]
    command:
      - worker
      - --control-url
      - http://trading-api:8080
      - --archive-root
      - /archive
      - --identity-registry-ref
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_REF:-}'
      - --identity-registry-sha256
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}'
      - --provider-config
      - /opt/provider-config.json
    environment:
      HOME: /opt/provider-home
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks: [workers, provider-egress]
    volumes:
      - type: bind
        source: ${TRADINGBOT_RESEARCH_IDENTITY_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADINGBOT_RESEARCH_PROVIDER_CONFIG_PATH:-./provider-config.json}
        target: /opt/provider-config.json
        read_only: true
        bind:
          create_host_path: false
      - provider-auth:/opt/provider-home/.tradingagents

  paper-entry: &paper-scheduler
    profiles: [paper-entry]
    image: ${TRADINGBOT_PAPER_ENTRY_IMAGE:-tradingbot-paper-entry:local}
    build:
      context: ../../services/research
      target: paper-entry
      additional_contexts:
        trading-api-image: service:trading-api
    command:
      - --root
      - /archive
      - --plan-ref
      - '${TRADINGBOT_PAPER_ENTRY_PLAN_REF:-}'
      - --plan-sha256
      - '${TRADINGBOT_PAPER_ENTRY_PLAN_SHA256:-}'
      - --journal
      - /journal
      - --paper-cli
      - /usr/local/bin/paper
      - --poll-interval-seconds
      - '1'
    environment:
      <<: *paper-service-endpoints
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      trading-api:
        condition: service_healthy
      accounts:
        condition: service_healthy
    networks: [paper-api]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - *paper-token-mount
      - paper-entry-journal:/journal
      - &paper-scheduler-archive
        type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-review-cycles:
    <<: *paper-scheduler
    profiles: [paper-review-cycles]
    entrypoint: [python, -m, tradingbot.review_cycles]
    command:
      - --root
      - /archive
      - --plan-ref
      - '${TRADINGBOT_PAPER_REVIEW_PLAN_REF:-}'
      - --plan-sha256
      - '${TRADINGBOT_PAPER_REVIEW_PLAN_SHA256:-}'
      - --journal
      - /journal
      - --paper-cli
      - /usr/local/bin/paper
      - --poll-interval-seconds
      - '1'
    volumes:
      - *paper-token-mount
      - paper-review-journal:/journal
      - *paper-scheduler-archive

  paper-review:
    profiles: [paper]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-trading-api:local}
    entrypoint: [/usr/local/bin/paper]
    command: [schedule-review, --config, /paper-config/review.json, --archive-root, /archive, --poll-interval, 30s]
    environment:
      <<: *paper-service-endpoints
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      trading-api:
        condition: service_healthy
      accounts:
        condition: service_healthy
    networks: [paper-api]
    read_only: true
    volumes:
      - *paper-token-mount
      - type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  orders: &orders
    profiles: [paper]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-trading-api:local}
    entrypoint: [/usr/local/bin/paper]
    command: [orders, --account, '${TRADINGBOT_PAPER_ACCOUNT_ID:-}', --policy, /paper-config/policy.json, --quote-root, /quotes, --poll-interval, 5s]
    environment: &orders-environment
      <<: *paper-service-endpoints
    depends_on:
      trading-api:
        condition: service_healthy
      accounts:
        condition: service_healthy
    networks: [paper-api]
    read_only: true
    volumes:
      - *paper-token-mount
      - &orders-config
        type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - &orders-quotes
        type: bind
        source: ${TRADINGBOT_PAPER_QUOTES_DIR:-./paper-quotes}
        target: /quotes
        read_only: true
        bind:
          create_host_path: false

  paper-quote: &paper-quote
    profiles: [paper-quote]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-trading-api:local}
    entrypoint: [/usr/local/bin/paper-quote-pin]
    command:
      - --account
      - '${TRADINGBOT_PAPER_ACCOUNT_ID:-}'
      - --tape
      - /paper-config/quote-tape.json
      - --sha256
      - '${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}'
      - --quote-root
      - /quotes
      - --poll-interval
      - 2s
    environment:
      <<: *paper-service-endpoints
    depends_on:
      trading-api:
        condition: service_healthy
      accounts:
        condition: service_healthy
    networks: [paper-api]
    read_only: true
    volumes:
      - *paper-token-mount
      - &paper-quote-config
        type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - &paper-quote-output
        type: bind
        source: ${TRADINGBOT_PAPER_QUOTES_DIR:-./paper-quotes}
        target: /quotes
        bind:
          create_host_path: false

  orders-identity:
    <<: *orders
    profiles: [paper-identity]
    command: [orders, --account, '${TRADINGBOT_PAPER_ACCOUNT_ID:-}', --policy, /paper-config/policy.json, --quote-root, /quotes, --archive-root, /archive, --poll-interval, 5s]
    environment:
      <<: *orders-environment
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
      TRADINGBOT_PAPER_QUOTE_TAPE_SHA256: ${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}
    volumes:
      - *paper-token-mount
      - *orders-config
      - *orders-quotes
      - &paper-identity-archive
        type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-identity-quote:
    <<: *paper-quote
    profiles: [paper-identity]
    command:
      - --account
      - '${TRADINGBOT_PAPER_ACCOUNT_ID:-}'
      - --tape
      - '/archive/${TRADINGBOT_PAPER_IDENTITY_QUOTE_TAPE_REF:-quote-tape.json}'
      - --sha256
      - '${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}'
      - --quote-root
      - /quotes
      - --poll-interval
      - 2s
    volumes:
      - *paper-token-mount
      - *paper-quote-config
      - *paper-quote-output
      - *paper-identity-archive

  kafka:
    extends:
      file: ../notifications/compose.yaml
      service: kafka
    profiles: [paper-notifications]

  kafka-init:
    extends:
      file: ../notifications/compose.yaml
      service: kafka-init
    profiles: [paper-notifications]
    environment: *paper-fill-kafka

  paper-fill-relay:
    profiles: [paper-notifications]
    image: tradingbot-trade-events:local
    build:
      context: ../../services/trade-events
      args:
        GO_IMAGE: ${TRADINGBOT_GO_BUILD_IMAGE:-golang:1.26.5-bookworm@sha256:53eeac89074db483fdf0ab3be1df32bf6e47562263d2d0d6baa7f26acb4957dd}
    command: [-paper-ledger]
    environment:
      <<: *paper-fill-kafka
      TRADINGBOT_DATABASE_URL: postgresql://trade_events@trade-events-postgres:5432/trade_events?sslmode=disable
      TRADINGBOT_ACCOUNTS_URL: http://accounts:8081
      TRADINGBOT_ACCOUNTS_OUTBOX_TOKEN_FILE: /run/tradingbot/outbox/token
    depends_on:
      paper-internal-token:
        condition: service_completed_successfully
      trade-events-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - *outbox-token-mount
    networks: [accounts-events, events-storage, events]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  paper-notifications:
    extends:
      file: ../notifications/compose.yaml
      service: notifications
    profiles: [paper-notifications]
    environment:
      <<: *paper-fill-kafka
      TRADINGBOT_NOTIFICATION_GROUP: ${TRADINGBOT_PAPER_NOTIFICATION_GROUP:-tradingbot-paper-telegram-v1}
    networks: [events, telegram-egress]
    read_only: true

  evaluation:
    profiles: [evaluation]
    image: ${TRADINGBOT_EVALUATION_IMAGE:-tradingbot-evaluation:local}
    build:
      context: ../../services/evaluation
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp

volumes:
  jobs-data:
  accounts-data:
  trade-events-data:
  internal-token:
  outbox-token:
  paper-entry-journal:
  paper-review-journal:
  provider-auth:
  kafka-data:

secrets:
  telegram_bot_token:
    environment: TRADINGBOT_PAPER_TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TRADINGBOT_PAPER_TELEGRAM_CHAT_ID

networks:
  storage:
    internal: true
  accounts-storage:
    internal: true
  events-storage:
    internal: true
  paper-api:
    internal: true
  accounts-events:
    internal: true
  workers:
    internal: true
  local-api:
  provider-egress:
  events:
    internal: true
  telegram-egress:
