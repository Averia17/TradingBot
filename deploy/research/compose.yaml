name: tradingbot-research

services:
  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: research_control
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, research_control, -d, tradingbot]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [storage]
    volumes:
      - research-data:/var/lib/postgresql/data

  control:
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-control:local}
    build:
      context: ../../services/control
      args:
        GO_IMAGE: ${TRADINGBOT_GO_BUILD_IMAGE:-golang:1.26.5-bookworm@sha256:53eeac89074db483fdf0ab3be1df32bf6e47562263d2d0d6baa7f26acb4957dd}
    command: [--listen, 0.0.0.0:8080]
    environment:
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${TRADINGBOT_CONTROL_PORT:-18080}:8080'
    networks: [storage, workers, local-api]
    read_only: true

  research:
    image: ${TRADINGBOT_RESEARCH_IMAGE:-tradingbot-research:local}
    build:
      context: ../../services/research
    command: [worker, --control-url, 'http://control:8080']
    depends_on:
      control:
        condition: service_healthy
    networks: [workers]
    read_only: true
    tmpfs:
      - /tmp

  paper-research:
    extends:
      service: research
    profiles: [paper]
    command: [worker, --control-url, 'http://control:8080', --archive-root, /archive]
    volumes:
      - type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  identity-research:
    extends:
      service: research
    profiles: [research-identity]
    command:
      - worker
      - --control-url
      - http://control:8080
      - --archive-root
      - /archive
      - --identity-registry-ref
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_REF:-}'
      - --identity-registry-sha256
      - '${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}'
    volumes:
      - type: bind
        source: ${TRADINGBOT_RESEARCH_IDENTITY_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-entry: &paper-scheduler
    profiles: [paper-entry]
    image: ${TRADINGBOT_PAPER_ENTRY_IMAGE:-tradingbot-paper-entry:local}
    build:
      context: ../../services/research
      target: paper-entry
      additional_contexts:
        control-image: service:control
    command:
      - --root
      - /archive
      - --plan-ref
      - '${TRADINGBOT_PAPER_ENTRY_PLAN_REF:-}'
      - --plan-sha256
      - '${TRADINGBOT_PAPER_ENTRY_PLAN_SHA256:-}'
      - --journal
      - /journal
      - --paper-apply
      - /usr/local/bin/paper-apply
      - --poll-interval-seconds
      - '1'
    environment:
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      control:
        condition: service_healthy
    networks: [storage]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - paper-entry-journal:/journal
      - &paper-scheduler-archive
        type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-review-cycles:
    <<: *paper-scheduler
    profiles: [paper-review-cycles]
    entrypoint: [python, -m, tradingbot.review_cycles]
    command:
      - --root
      - /archive
      - --plan-ref
      - '${TRADINGBOT_PAPER_REVIEW_PLAN_REF:-}'
      - --plan-sha256
      - '${TRADINGBOT_PAPER_REVIEW_PLAN_SHA256:-}'
      - --journal
      - /journal
      - --paper-apply
      - /usr/local/bin/paper-apply
      - --poll-interval-seconds
      - '1'
    volumes:
      - paper-review-journal:/journal
      - *paper-scheduler-archive

  paper-review:
    profiles: [paper]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-control:local}
    entrypoint: [/usr/local/bin/paper-apply]
    command: [schedule-review, --config, /paper-config/review.json, --archive-root, /archive, --poll-interval, 30s]
    environment:
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
    depends_on:
      control:
        condition: service_healthy
    networks: [storage]
    read_only: true
    volumes:
      - type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-dispatch: &paper-dispatch
    profiles: [paper]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-control:local}
    entrypoint: [/usr/local/bin/paper-apply]
    command: [dispatch, --account, '${TRADINGBOT_PAPER_ACCOUNT_ID:-}', --policy, /paper-config/policy.json, --quote-root, /quotes, --poll-interval, 5s]
    environment: &paper-dispatch-environment
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
    depends_on:
      control:
        condition: service_healthy
    networks: [storage]
    read_only: true
    volumes:
      - &paper-dispatch-config
        type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - &paper-dispatch-quotes
        type: bind
        source: ${TRADINGBOT_PAPER_QUOTES_DIR:-./paper-quotes}
        target: /quotes
        read_only: true
        bind:
          create_host_path: false

  paper-quote: &paper-quote
    profiles: [paper-quote]
    image: ${TRADINGBOT_CONTROL_IMAGE:-tradingbot-control:local}
    entrypoint: [/usr/local/bin/paper-quote-pin]
    command:
      - --account
      - '${TRADINGBOT_PAPER_ACCOUNT_ID:-}'
      - --tape
      - /paper-config/quote-tape.json
      - --sha256
      - '${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}'
      - --quote-root
      - /quotes
      - --poll-interval
      - 2s
    environment:
      TRADINGBOT_DATABASE_URL: postgresql://research_control@postgres:5432/tradingbot?sslmode=disable
    depends_on:
      control:
        condition: service_healthy
    networks: [storage]
    read_only: true
    volumes:
      - &paper-quote-config
        type: bind
        source: ${TRADINGBOT_PAPER_CONFIG_DIR:-./paper-config}
        target: /paper-config
        read_only: true
        bind:
          create_host_path: false
      - &paper-quote-output
        type: bind
        source: ${TRADINGBOT_PAPER_QUOTES_DIR:-./paper-quotes}
        target: /quotes
        bind:
          create_host_path: false

  paper-identity-dispatch:
    <<: *paper-dispatch
    profiles: [paper-identity]
    command: [dispatch, --account, '${TRADINGBOT_PAPER_ACCOUNT_ID:-}', --policy, /paper-config/policy.json, --quote-root, /quotes, --archive-root, /archive, --poll-interval, 5s]
    environment:
      <<: *paper-dispatch-environment
      TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256: ${TRADINGBOT_RESEARCH_IDENTITY_REGISTRY_SHA256:-}
      TRADINGBOT_PAPER_QUOTE_TAPE_SHA256: ${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}
    volumes:
      - *paper-dispatch-config
      - *paper-dispatch-quotes
      - &paper-identity-archive
        type: bind
        source: ${TRADINGBOT_PAPER_ARCHIVE_DIR:-./paper-archive}
        target: /archive
        read_only: true
        bind:
          create_host_path: false

  paper-identity-quote:
    <<: *paper-quote
    profiles: [paper-identity]
    command:
      - --account
      - '${TRADINGBOT_PAPER_ACCOUNT_ID:-}'
      - --tape
      - '/archive/${TRADINGBOT_PAPER_IDENTITY_QUOTE_TAPE_REF:-quote-tape.json}'
      - --sha256
      - '${TRADINGBOT_PAPER_QUOTE_TAPE_SHA256:-}'
      - --quote-root
      - /quotes
      - --poll-interval
      - 2s
    volumes:
      - *paper-quote-config
      - *paper-quote-output
      - *paper-identity-archive

  evaluation:
    profiles: [evaluation]
    image: ${TRADINGBOT_EVALUATION_IMAGE:-tradingbot-evaluation:local}
    build:
      context: ../../services/evaluation
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp

volumes:
  research-data:
  paper-entry-journal:
  paper-review-journal:

networks:
  storage:
    internal: true
  workers:
    internal: true
  local-api:
