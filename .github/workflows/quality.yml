name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out our code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false

      - name: Reproduce clean upstream checkouts
        run: uv run --no-project python scripts/upstream.py bootstrap

      - name: Install locked dependencies
        run: uv sync --frozen --extra evaluation

      - name: Check dependency metadata
        run: uv pip check

      - name: Lint our code
        run: uv run --frozen --extra evaluation ruff check src tests scripts

      - name: Test our contracts and adapters without network access
        run: uv run --frozen --extra evaluation pytest --junitxml=runtime/verification/ours.xml

      # Upstream's default suite excludes its external-service integration marker.
      # Linux also avoids its Windows-only assumption that TEMP is outside HOME.
      - name: Run upstream's isolated test suite
        if: runner.os == 'Linux'
        working-directory: vendor/trading-agents
        run: uv run --project ../.. --frozen --extra evaluation pytest -c pyproject.toml tests --junitxml=../../runtime/verification/upstream.xml

      - name: Build our distribution
        run: uv build --no-sources

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-${{ matrix.os }}
          path: runtime/verification/*.xml
          retention-days: 14
          if-no-files-found: warn

  go-quality:
    name: Go Quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: tradingbot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d tradingbot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out our code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l go)
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify Go modules
        run: go -C go mod verify

      - name: Vet Go code
        run: go -C go vet -mod=readonly ./...

      - name: Test Go packages
        run: go -C go test -mod=readonly ./...

      - name: Check Go packages for races
        env:
          CGO_ENABLED: "1"
          TRADINGBOT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/tradingbot?sslmode=disable
        run: go -C go test -mod=readonly -race ./...

      - name: Build Go packages
        run: go -C go build -mod=readonly ./...
