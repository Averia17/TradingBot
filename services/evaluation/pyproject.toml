[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "tradingbot-evaluation"
version = "0.1.0"
description = "Offline TradingBot evaluation with the native Nautilus engine"
requires-python = ">=3.12,<3.13"
dependencies = ["msgspec==0.22.0", "nautilus-trader==1.231.0"]

[project.scripts]
tradingbot-evaluation = "tradingbot_evaluation.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
