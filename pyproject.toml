[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "self-custody-ai-trader"
version = "0.1.0"
description = "Portfolio-aware TradingAgents research boundary; no live execution"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "tradingagents==0.6.0"]

[project.optional-dependencies]
evaluation = ["nautilus_trader==1.231.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "pytest-subtests>=0.13"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.uv.sources]
tradingagents = {path = "vendor/trading-agents", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

